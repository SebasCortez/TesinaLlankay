<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fondo Redondeado con Sombra -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Geometría Andina Escalonada (Chakana sutil en fondo) -->
  <path d="M64 22 L72 30 L80 30 L80 38 L88 38 L96 46 L96 54 L104 54 L104 74 L96 74 L96 82 L88 82 L80 90 L80 98 L72 98 L64 106 L56 98 L48 98 L48 90 L40 82 L32 82 L32 74 L24 74 L24 54 L32 54 L32 46 L40 38 L48 38 L48 30 L56 30 Z" 
        fill="rgba(255, 255, 255, 0.08)" />

  <!-- Corona / Sol de Oro (Inca Sunburst sutil) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.85" />

  <!-- Isotipo de Llave Inglesa Llankay -->
  <g transform="translate(64,64) rotate(-35) translate(-64,-64)">
    <!-- Mango de la herramienta -->
    <rect x="58" y="44" width="12" height="48" rx="6" fill="url(#metalGrad)" />
    <!-- Agujero inferior del mango -->
    <circle cx="64" cy="84" r="3.5" fill="#4F46E5" />
    
    <!-- Cabeza de la llave inglesa -->
    <path d="M50 28 C50 18 78 18 78 28 C78 34 74 38 72 40 L56 40 C54 38 50 34 50 28 Z" fill="url(#metalGrad)" />
    <!-- Boca / mordaza de la llave -->
    <path d="M58 20 L70 20 L70 32 L64 34 L58 32 Z" fill="url(#bgGrad)" />
  </g>

  <!-- Estrella / Chispa de Calidad en Oro -->
  <path d="M92 34 L94 40 L100 42 L94 44 L92 50 L90 44 L84 42 L90 40 Z" fill="url(#goldGrad)" />
  <circle cx="34" cy="90" r="3" fill="url(#goldGrad)" />
</svg>
