services:
  - type: web
    name: llankay-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && (python manage.py poblar_datos || true) && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: GOOGLE_CLIENT_ID
        value: "605736068030-jru251fq1896bsar8p90skg4hdl4q768.apps.googleusercontent.com"
