services:
  - type: web
    name: llankay-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py poblar_datos && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
