version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: llankay_db
    environment:
      POSTGRES_DB: llankay_db
      POSTGRES_USER: llankay_user
      POSTGRES_PASSWORD: llankay_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llankay_backend
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-secret-key-llankay-2026
      - DATABASE_URL=postgres://llankay_user:llankay_password@db:5432/llankay_db
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/media:/app/media

volumes:
  postgres_data:
